# Clean-clone CI: sibling private deps checked out into deps/.
#
# Default GITHUB_TOKEN cannot read other private repos. Set repository secret
# CROSS_REPO_PAT (classic PAT or fine-grained with contents:read on
# safetensors-zig + tokenizers-zig) for multi-checkout to work.
name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout vllm-zig
        uses: actions/checkout@v4
        with:
          fetch-depth: 1

      - name: Checkout safetensors-zig into deps/
        uses: actions/checkout@v4
        with:
          repository: SMC17/safetensors-zig
          path: deps/safetensors-zig
          fetch-depth: 1
          token: ${{ secrets.CROSS_REPO_PAT || github.token }}

      - name: Checkout tokenizers-zig into deps/
        uses: actions/checkout@v4
        with:
          repository: SMC17/tokenizers-zig
          path: deps/tokenizers-zig
          fetch-depth: 1
          token: ${{ secrets.CROSS_REPO_PAT || github.token }}

      - uses: mlugg/setup-zig@v2
        with:
          version: 0.16.0

      - name: zig version
        run: zig version

      - name: zig build test
        run: zig build test --summary all
