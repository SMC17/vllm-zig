# Clean-clone CI: dependencies are fetched by `zig build` from the
# url+hash pins in build.zig.zon.
name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout vllm-zig
        uses: actions/checkout@v4
        with:
          fetch-depth: 1

      - uses: mlugg/setup-zig@v2
        with:
          version: 0.16.0

      - name: zig version
        run: zig version

      - name: zig build test
        run: zig build test --summary all
