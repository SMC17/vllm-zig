# Clean-clone CI: sibling private deps checked out into deps/ (not ../).
# Requires Actions access to SMC17/safetensors-zig and SMC17/tokenizers-zig
# (same owner private repos + GITHUB_TOKEN is enough with default permissions).
name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout vllm-zig
        uses: actions/checkout@v4
        with:
          fetch-depth: 1

      - name: Checkout safetensors-zig into deps/
        uses: actions/checkout@v4
        with:
          repository: SMC17/safetensors-zig
          path: deps/safetensors-zig
          fetch-depth: 1

      - name: Checkout tokenizers-zig into deps/
        uses: actions/checkout@v4
        with:
          repository: SMC17/tokenizers-zig
          path: deps/tokenizers-zig
          fetch-depth: 1

      - uses: mlugg/setup-zig@v2
        with:
          version: 0.16.0

      - name: zig version
        run: zig version

      - name: zig build test
        # Integration example examples/infer_tinyllama.zig needs a large
        # safetensors fixture and is NOT exercised here.
        run: zig build test --summary all
